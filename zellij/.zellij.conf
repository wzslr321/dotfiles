# Attach to a zellij session; pick interactively when more than one exists.
zas() {
    local sessions choice
    sessions=(${(f)"$(zellij list-sessions -s 2>/dev/null)"})

    if (( ${#sessions[@]} <= 1 )); then
        zellij attach -c "${sessions[1]:-default}"
        return
    fi

    select choice in "${sessions[@]}"; do
        [[ -n "$choice" ]] && zellij attach -c "$choice" && return
    done
}
